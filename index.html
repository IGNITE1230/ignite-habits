<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0f"><title>IGNITE HABITS | 昨日の自分を超えろ</title><style>
:root{color-scheme:dark;--bg:#0d0d0f;--panel:#19191d;--panel2:#222227;--gold:#e6b75b;--muted:#a5a4ab;--line:#35343a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#332713 0%,#0d0d0f 38%);color:#f7f4ee;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.wrap{max-width:680px;margin:auto;padding:24px 18px 75px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 30px}.brand{display:flex;gap:10px;align-items:center;color:var(--gold);font-size:21px;font-weight:900;letter-spacing:.13em}.brand .flame{font-size:27px}.tiny{font-size:10px;letter-spacing:.22em;color:var(--muted)}.date{color:var(--muted);font-size:12px}.hero{background:linear-gradient(125deg,#2b2117,#1b1a1e 70%);border:1px solid #5b4629;border-radius:20px;padding:25px 22px;margin-bottom:20px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.22em;font-weight:800}.hero h1{font-size:clamp(21px,5vw,29px);margin:13px 0;line-height:1.5}.hero p{color:#c5bcb0;font-size:13px;margin:0;line-height:1.7}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 1px 12px}.section h2{font-size:16px;margin:0}.pill{font-size:12px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px 8px;text-align:center}.stat strong{display:block;color:var(--gold);font-size:25px;font-variant-numeric:tabular-nums}.stat span{font-size:10px;color:var(--muted)}.progress{height:7px;background:#38373a;border-radius:9px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#a67831,#f5d58a);transition:width .2s}.habit{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:9px;padding:12px;display:flex;gap:12px;align-items:center}.check{width:38px;height:38px;border:1px solid #65616a;border-radius:12px;background:#242329;color:#fff;font-size:20px;flex-shrink:0}.check.done{background:var(--gold);border-color:var(--gold);color:#16120b}.habit-text{flex:1;min-width:0}.habit-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.habit-sub{font-size:11px;color:var(--muted);margin-top:4px}.more{background:transparent;border:0;color:var(--muted);font-size:20px;padding:8px}.actions{display:flex;gap:5px}.actions button{border:1px solid var(--line);background:#24242a;border-radius:9px;color:#d9d5cc;padding:7px;font-size:12px}.add{width:100%;padding:15px;border-radius:13px;background:transparent;color:var(--gold);border:1px dashed #876a3e;font-weight:700;margin-top:5px}.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;background:var(--panel);border:1px solid var(--line);padding:17px 11px;border-radius:16px}.day{text-align:center}.day .pct{font-size:10px;color:var(--muted);margin-bottom:7px}.day .track{height:75px;background:#302e2e;border-radius:7px;display:flex;align-items:end;overflow:hidden}.day .fill{background:linear-gradient(#f1cb7c,#a57a36);width:100%;min-height:0;border-radius:6px}.day .label{font-size:10px;color:var(--muted);margin-top:8px}.empty{padding:25px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;font-size:13px;line-height:1.8}.foot{text-align:center;color:#77737a;font-size:11px;margin-top:30px;line-height:1.7}.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.open{display:flex}.modal{width:min(100%,420px);background:#202024;border:1px solid #4b4133;border-radius:18px;padding:23px}.modal h3{margin:0 0 16px}.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.modal input{width:100%;padding:13px;background:#101014;border:1px solid #58535a;border-radius:10px;color:white}.modal .buttons{display:flex;gap:8px;margin-top:18px}.modal .buttons button{flex:1;padding:12px;border-radius:10px;border:1px solid #555;background:#34343a;color:white}.modal .buttons .primary{background:var(--gold);color:#18130b;border:0;font-weight:800}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:390px){.date{font-size:10px}.wrap{padding:18px 13px 65px}.stat strong{font-size:22px}.actions button{font-size:11px;padding:6px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand"><span class="flame" aria-hidden="true">♨</span> IGNITE</div><div class="tiny">HABITS / BUILD YOURSELF</div></div><div class="date" id="date"></div></header><section class="hero"><div class="eyebrow">TODAY'S MINDSET</div><h1 id="quote"></h1><p id="quoteSub"></p></section><section class="stats" aria-label="今日の記録"><div class="stat"><strong id="doneCount">0/0</strong><span>今日の達成</span></div><div class="stat"><strong id="rate">0%</strong><span>今日の達成率</span></div><div class="stat"><strong id="streak">0日</strong><span>連続達成日数</span></div></section><div class="progress" role="progressbar" aria-label="今日の達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div><div class="section"><h2>今日の習慣</h2><span class="pill" id="todayLabel"></span></div><div id="habitList"></div><button class="add" id="add">＋ 新しい習慣を追加</button><div class="section"><h2>過去7日間の達成率</h2><span class="pill">LAST 7 DAYS</span></div><div class="chart" id="chart" aria-label="過去7日間の達成率"></div><p class="foot">昨日の自分を、超えろ。<br>記録はこのブラウザ内に保存されます。ブラウザデータを消すと記録も消えます。</p></main><div class="modal-back" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal" id="form"><h3 id="modalTitle">習慣を追加</h3><label for="habitInput">習慣の名前（例：読書10分）</label><input id="habitInput" maxlength="50" required autocomplete="off" placeholder="習慣を入力"><div class="buttons"><button type="button" id="cancel">キャンセル</button><button type="submit" class="primary">保存する</button></div></form></div><script>
(()=>{'use strict';const KEY='ignite-habits-v1';const $=id=>document.getElementById(id);const quotes=[['昨日の自分を、超えろ。','大きな変化は、今日の小さな一歩から。'],['続けた日々が、自信になる。','完璧よりも、今日できることを。'],['未来は、今日の選択で変わる。','小さな約束を一つずつ守ろう。'],['始める勇気が、道をつくる。','最初の一歩はいつだって価値がある。'],['努力は、静かに積み重なる。','誰にも見えない一日が、未来の自分を支える。'],['諦めなかった自分を誇れ。','一度止まっても、また始めればいい。'],['行動が、明日の自分をつくる。','今日の一歩を記録しよう。']];const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const offsetDay=(n)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d};const today=()=>dateKey();const defaults=()=>({habits:[{id:'sample1',name:'読書 10分',created:today()},{id:'sample2',name:'運動 20分',created:today()}],records:{}});let state;try{const v=JSON.parse(localStorage.getItem(KEY));state=v&&Array.isArray(v.habits)&&v.records&&typeof v.records==='object'?v:defaults()}catch{state=defaults()}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存できませんでした。ブラウザの保存設定を確認してください。')}};if(!localStorage.getItem(KEY))save();let editing=null;const getDayHabits=k=>state.habits.filter(h=>h.created<=k&&(!h.deleted||h.deleted>k));const isDone=(id,k)=>Boolean(state.records[k]&&state.records[k][id]);const dayRate=k=>{const h=getDayHabits(k);return h.length?Math.round(h.filter(x=>isDone(x.id,k)).length/h.length*100):0};const fullDay=k=>{const h=getDayHabits(k);return h.length>0&&h.every(x=>isDone(x.id,k))};const calcStreak=()=>{let n=0,first=fullDay(today())?0:-1;for(let i=first;i>=-3650;i--){if(!fullDay(dateKey(offsetDay(i))))break;n++}return n};function render(){const d=new Date();$('date').textContent=d.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});$('todayLabel').textContent=`${d.getMonth()+1}月${d.getDate()}日`;const q=quotes[Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/86400000)%quotes.length];$('quote').textContent=q[0];$('quoteSub').textContent=q[1];const k=today(),h=getDayHabits(k),done=h.filter(x=>isDone(x.id,k)).length,r=dayRate(k);$('doneCount').textContent=`${done}/${h.length}`;$('rate').textContent=r+'%';$('streak').textContent=calcStreak()+'日';$('bar').style.width=r+'%';$('progress').setAttribute('aria-valuenow',String(r));const list=$('habitList');list.replaceChildren();if(!h.length){const p=document.createElement('div');p.className='empty';p.textContent='まだ習慣がありません。まずは一つ追加してみよう！';list.append(p)}h.forEach(x=>{const item=document.createElement('div');item.className='habit';const check=document.createElement('button');check.className='check'+(isDone(x.id,k)?' done':'');check.textContent=isDone(x.id,k)?'✓':'';check.setAttribute('aria-label',x.name+'の達成を切り替える');check.setAttribute('aria-pressed',String(isDone(x.id,k)));check.onclick=()=>{state.records[k]??={};state.records[k][x.id]=!isDone(x.id,k);save();render()};const info=document.createElement('div');info.className='habit-text';const name=document.createElement('div');name.className='habit-name';name.textContent=x.name;const sub=document.createElement('div');sub.className='habit-sub';sub.textContent=isDone(x.id,k)?'今日も達成！':'今日の一歩を記録しよう';info.append(name,sub);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='編集';edit.setAttribute('aria-label',x.name+'を編集');edit.onclick=()=>openModal(x.id);const del=document.createElement('button');del.textContent='削除';del.setAttribute('aria-label',x.name+'を削除');del.onclick=()=>{if(confirm('「'+x.name+'」を削除しますか？ 過去の記録は残ります。')){x.deleted=today();save();render()}};actions.append(edit,del);item.append(check,info,actions);list.append(item)});const chart=$('chart');chart.replaceChildren();for(let i=-6;i<=0;i++){const day=offsetDay(i),key=dateKey(day),r=dayRate(key);const el=document.createElement('div');el.className='day';const pct=document.createElement('div');pct.className='pct';pct.textContent=r+'%';const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.height=r+'%';track.append(fill);const label=document.createElement('div');label.className='label';label.textContent=i===0?'今日':`${day.getMonth()+1}/${day.getDate()}`;el.title=key+'：'+r+'%';el.append(pct,track,label);chart.append(el)}}function openModal(id=null){editing=id;const h=state.habits.find(x=>x.id===id);$('modalTitle').textContent=h?'習慣を編集':'習慣を追加';$('habitInput').value=h?h.name:'';$('modal').classList.add('open');$('habitInput').focus()}function closeModal(){$('modal').classList.remove('open');editing=null}$('add').onclick=()=>openModal();$('cancel').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('form').onsubmit=e=>{e.preventDefault();const name=$('habitInput').value.trim();if(!name)return;if(editing){const h=state.habits.find(x=>x.id===editing);if(h)h.name=name}else{state.habits.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name,created:today()})}save();closeModal();render()};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});})();
</script></body></html>
